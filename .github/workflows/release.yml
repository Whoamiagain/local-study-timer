name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Publish Electron App
        run: npm run build && node -e "require('electron-builder').build({publish:'never'}).catch(error => { console.error(error); process.exit(1); })"

      - name: Align Windows installer with update metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Get-Content dist/latest.yml -Raw
          $match = [regex]::Match($manifest, '(?m)^\s*-\s*url:\s*(?<name>.+?)\s*$')
          if (-not $match.Success) {
            throw 'Could not find the Windows installer name in dist/latest.yml.'
          }

          $expectedName = $match.Groups['name'].Value
          $installers = @(Get-ChildItem dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Name -ne $expectedName) {
            $expectedPath = Join-Path dist $expectedName
            Move-Item $installer.FullName $expectedPath

            $blockmapPath = "$($installer.FullName).blockmap"
            if (Test-Path $blockmapPath) {
              Move-Item $blockmapPath "$expectedPath.blockmap"
            }
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: local-study-timer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: local-study-timer-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}